<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEUS | ACADEMY — منصة السادس الإعدادي</title>
<meta name="theme-color" content="#070707">
<meta name="description" content="منصة تعليمية لطلاب السادس الإعدادي - الفرع العملي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070706'/%3E%3Cpath d='M55 15 20 58h26l-9 33 45-58H55l9-18z' fill='%23F1B76D'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#070706;
  --bg-elev:#131210;
  --card:#161513;
  --card-border:#2a2620;
  --teal:#2DD4C8;
  --teal-dim:#1a8f86;
  --teal-glow:rgba(45,212,200,.18);
  --gold:#F1B76D;
  --gold-dim:#a97b3d;
  --gold-glow:rgba(241,183,109,.20);
  --gold-line:rgba(241,183,109,.35);
  --text:#F5F1E8;
  --text-dim:#948d7d;
  --text-faint:#5c5850;
  --danger:#e5484d;
  --radius:16px;
  --radius-sm:10px;
  --nav-h:64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  font-size:15px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo','Tajawal',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 12% -5%, var(--gold-glow), transparent 42%),
    radial-gradient(circle at 105% 15%, var(--teal-glow), transparent 40%),
    radial-gradient(circle at 50% 115%, rgba(241,183,109,.07), transparent 50%);
  pointer-events:none; z-index:0;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
img{max-width:100%; display:block;}
::selection{background:var(--teal); color:#000;}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:#2a2a2a; border-radius:10px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:14px 16px;
  background:rgba(7,7,7,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--card-border);
}
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.brand-mark{
  width:40px; height:40px; border-radius:12px;
  background:linear-gradient(150deg,var(--gold),var(--gold-dim));
  display:flex; align-items:center; justify-content:center;
  color:#241505;
  flex-shrink:0;
  box-shadow:0 4px 18px var(--gold-glow);
  position:relative;
}
.brand-mark svg{width:21px; height:21px;}
.brand-text{min-width:0;}
.brand-text .gr{font-size:17px; font-weight:900; letter-spacing:1.2px; color:var(--text); white-space:nowrap;}
.brand-text .gr span{color:var(--gold); font-weight:900;}
.brand-text .ar{font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{
  width:38px; height:38px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-elev); border:1px solid var(--card-border);
  color:var(--text-dim); flex-shrink:0; font-size:17px;
}
.icon-btn:active{transform:scale(.93); background:#1a1a1a;}
.auth-chip{
  display:flex; align-items:center; gap:8px;
  background:var(--bg-elev); border:1px solid var(--card-border);
  border-radius:22px; padding:7px 8px 7px 14px; flex-shrink:0; height:38px;
}
.auth-chip .ac-avatar{
  width:24px; height:24px; border-radius:50%; background:var(--teal); color:#04211f;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; flex-shrink:0;
}
.auth-chip .ac-name{font-size:11.5px; font-weight:700; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.auth-chip.login-chip{color:var(--gold); font-weight:800; font-size:12.5px; padding:0 16px; border-color:var(--gold-line);}
.auth-chip.login-chip .icn{color:var(--gold);}

/* ---------- layout ---------- */
.view{position:relative; z-index:1; padding:16px; max-width:640px; margin:0 auto; animation:viewIn .32s cubic-bezier(.2,.8,.2,1);}
@keyframes viewIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.hidden{display:none !important;}

.crumbs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px; font-size:12.5px; color:var(--text-faint);}
.crumbs b{color:var(--text-dim); font-weight:700;}
.crumbs span.sep{color:var(--text-faint);}

.page-title{font-size:20px; font-weight:800; margin-bottom:4px;}
.page-sub{font-size:13px; color:var(--text-dim); margin-bottom:18px;}

/* ---------- hero ---------- */
.hero{
  position:relative; overflow:hidden;
  border-radius:22px; padding:28px 20px;
  margin-bottom:24px;
  background:
    radial-gradient(circle at 100% -10%, rgba(241,183,109,.22), transparent 55%),
    radial-gradient(circle at -5% 130%, rgba(45,212,200,.16), transparent 60%),
    linear-gradient(165deg,#171512,#09080700);
  border:1px solid var(--gold-line);
  box-shadow:0 14px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(rgba(241,183,109,.35) .6px, transparent .6px);
  background-size:16px 16px;
  -webkit-mask-image:linear-gradient(180deg, black, transparent 65%);
  mask-image:linear-gradient(180deg, black, transparent 65%);
}
.hero-eyebrow{
  position:relative; z-index:1;
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:800; color:var(--gold); letter-spacing:1.5px;
  background:var(--gold-glow); border:1px solid var(--gold-line);
  padding:5px 12px; border-radius:20px; margin-bottom:14px;
}
.hero-title{position:relative; z-index:1; font-size:23px; font-weight:900; line-height:1.4; margin-bottom:6px;}
.hero-title span{color:var(--gold);}
.hero-sub{position:relative; z-index:1; font-size:13px; color:var(--text-dim); line-height:1.8; max-width:420px; margin-bottom:20px;}
.hero-stats{position:relative; z-index:1; display:flex; gap:10px; flex-wrap:wrap;}
.hero-stat{
  flex:1; min-width:88px;
  background:rgba(255,255,255,.03); border:1px solid var(--card-border);
  border-radius:14px; padding:12px 10px; text-align:center;
}
.hero-stat .hs-num{font-size:19px; font-weight:900; color:var(--gold);}
.hero-stat .hs-label{font-size:10.5px; color:var(--text-faint); margin-top:3px; font-weight:600;}
.section-label{
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:800; color:var(--text-dim); margin-bottom:14px;
}
.section-label .dot{width:6px; height:6px; border-radius:50%; background:var(--gold);}

/* ---------- search ---------- */
.search-bar{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--card-border);
  border-radius:16px; padding:12px 15px; margin-bottom:20px;
}
.search-bar .icn{color:var(--text-faint); flex-shrink:0;}
.search-bar input{
  flex:1; background:none; border:none; outline:none; color:var(--text);
  font-family:inherit; font-size:13.5px;
}
.search-bar input::placeholder{color:var(--text-faint);}
.search-bar .sb-clear{color:var(--text-faint); flex-shrink:0; display:none;}
.search-bar.has-text .sb-clear{display:flex;}

.search-results{margin-bottom:10px;}
.sr-group-label{font-size:11.5px; font-weight:800; color:var(--gold); margin:16px 0 10px; display:flex; align-items:center; gap:6px;}
.sr-group-label:first-child{margin-top:0;}
.sr-row{
  display:flex; align-items:center; gap:12px;
  background:var(--card); border:1px solid var(--card-border);
  border-radius:12px; padding:12px 14px; margin-bottom:9px;
}
.sr-row .sr-icon{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--gold-glow); border:1px solid var(--gold-line); color:var(--gold);
  display:flex; align-items:center; justify-content:center;
}
.sr-row .sr-text{flex:1; min-width:0;}
.sr-row .sr-title{font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sr-row .sr-path{font-size:10.5px; color:var(--text-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- continue watching ---------- */
.continue-card{
  display:flex; align-items:center; gap:14px;
  background:linear-gradient(120deg,var(--gold-glow),transparent);
  border:1px solid var(--gold-line); border-radius:18px;
  padding:14px; margin-bottom:20px;
}
.continue-card .cc-thumb{
  width:52px; height:52px; border-radius:14px; flex-shrink:0;
  background:radial-gradient(circle,rgba(241,183,109,.22),transparent 70%);
  border:1.5px solid var(--gold-line); color:var(--gold);
  display:flex; align-items:center; justify-content:center;
}
.continue-card .cc-text{flex:1; min-width:0;}
.continue-card .cc-label{font-size:10.5px; font-weight:800; color:var(--gold); letter-spacing:.3px;}
.continue-card .cc-title{font-weight:800; font-size:13.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.continue-card .cc-arrow{color:var(--gold); flex-shrink:0; width:18px; height:18px;}

/* ---------- subjects grid (medallion cards) ---------- */
.grid-subjects{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
.subject-card{
  position:relative; overflow:hidden;
  background:linear-gradient(165deg,var(--card),#0d0c0a);
  border:1px solid var(--card-border);
  border-radius:18px;
  padding:20px 14px 16px;
  display:flex; flex-direction:column; align-items:center; gap:9px;
  text-align:center;
  box-shadow:0 8px 22px rgba(0,0,0,.32);
  transition:transform .15s, border-color .15s, box-shadow .15s;
  opacity:0; animation:cardIn .45s ease forwards;
}
.subject-card::before{
  content:""; position:absolute; top:-40%; right:-30%; width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle, var(--gold-glow), transparent 70%);
  pointer-events:none;
}
.subject-card:active{transform:scale(.96); border-color:var(--gold-line);}
.subject-icon{
  width:56px; height:56px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; position:relative;
  background:radial-gradient(circle,rgba(241,183,109,.14),transparent 70%);
  border:1.5px solid var(--gold-line);
  color:var(--gold);
  box-shadow:0 0 0 4px rgba(241,183,109,.05);
}
.icn{display:inline-flex; flex-shrink:0;}
.icn svg{width:100%; height:100%; display:block;}
.subject-name{font-weight:800; font-size:14.5px;}
.subject-meta{
  font-size:10px; color:var(--gold); font-weight:700; letter-spacing:.3px;
  background:var(--gold-glow); border:1px solid var(--gold-line);
  padding:2px 10px; border-radius:20px;
}

@keyframes cardIn{
  from{opacity:0; transform:translateY(14px) scale(.97);}
  to{opacity:1; transform:none;}
}

/* ---------- teachers — premium grid cards ---------- */
.grid-teachers{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
.teacher-card{
  background:linear-gradient(170deg,var(--card),#0d0c0a);
  border:1px solid var(--card-border); border-radius:18px;
  padding:20px 14px 16px; text-align:center;
  box-shadow:0 8px 22px rgba(0,0,0,.3);
  opacity:0; animation:cardIn .4s ease forwards;
}
.teacher-card:active{transform:scale(.96); border-color:var(--gold-line);}
.teacher-avatar{
  width:64px; height:64px; border-radius:50%; flex-shrink:0; margin:0 auto 12px;
  background:linear-gradient(145deg,#1d1b17,#0c0b09);
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:20px; color:var(--gold);
  overflow:hidden;
  box-shadow:0 0 0 3px var(--gold-glow);
}
.teacher-avatar img{width:100%; height:100%; object-fit:cover;}
.teacher-name{font-weight:800; font-size:13.5px; line-height:1.4;}
.teacher-sub{
  font-size:10px; color:var(--gold); font-weight:700; margin-top:6px;
  background:var(--gold-glow); display:inline-block; padding:2px 10px; border-radius:20px;
}
.chev{color:var(--text-faint); width:16px; height:16px;}
.mr-actions .del{display:flex; align-items:center;}

/* ---------- chapter cards ---------- */
.chapter-card{
  background:linear-gradient(170deg,var(--card),#0d0c0a); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:18px; margin-bottom:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0; animation:cardIn .4s ease forwards;
}
.chapter-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.chapter-title{font-weight:800; font-size:16px; line-height:1.4;}
.chapter-teacher{font-size:12px; color:var(--text-dim); margin-top:4px;}
.chapter-badge{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle,rgba(241,183,109,.14),transparent 70%);
  border:1.5px solid var(--gold-line);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  color:var(--gold);
}
.chapter-stats{display:flex; gap:24px; margin:16px 0 10px;}
.stat-num{font-size:22px; font-weight:800; color:var(--gold);}
.stat-label{font-size:11px; color:var(--text-faint); margin-top:2px;}
.progress-track{height:5px; border-radius:10px; background:#232323; overflow:hidden; margin-bottom:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:10px; transition:width .5s ease;}
.progress-label{font-size:11.5px; color:var(--text-faint); margin-bottom:14px;}
.btn-start{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(150deg, var(--gold-glow), transparent); border:1px solid var(--gold-line);
  border-radius:var(--radius-sm); padding:13px 16px;
  font-weight:800; font-size:14px; color:var(--gold);
}
.btn-start:active{background:var(--gold-glow);}

/* ---------- lecture rows (numbered coins) ---------- */
.lecture-row{
  display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--card-border); border-right:3px solid var(--card-border);
  border-radius:var(--radius-sm); padding:13px 16px; margin-bottom:10px;
  opacity:0; animation:cardIn .35s ease forwards;
  transition:border-color .2s;
}
.lecture-row.done{border-right-color:var(--gold);}
.lecture-num{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  border:1.5px solid var(--card-border); display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:var(--text-faint); transition:.2s;
  background:var(--bg-elev);
}
.lecture-row.done .lecture-num{
  background:radial-gradient(circle,rgba(241,183,109,.16),transparent 70%);
  border-color:var(--gold); color:var(--gold);
}
.lecture-title{flex:1; font-weight:700; font-size:14px;}
.lecture-play{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:var(--teal-glow); display:flex; align-items:center; justify-content:center;
  color:var(--teal); font-size:13px;
}

/* ---------- empty state ---------- */
.empty{
  text-align:center; padding:60px 20px; color:var(--text-faint);
}
.empty .e-icon{margin:0 auto 14px; opacity:.5; color:var(--text-dim); display:flex; justify-content:center;}
.empty .e-title{font-weight:700; color:var(--text-dim); margin-bottom:6px; font-size:15px;}
.empty .e-sub{font-size:12.5px; line-height:1.7;}
.empty button{margin-top:16px; color:var(--teal); font-weight:700; font-size:13px; border:1px solid var(--teal-dim); padding:9px 18px; border-radius:20px;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; right:0; left:0; z-index:50;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(10,10,10,.92);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--card-border);
  display:flex;
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; font-size:10.5px; color:var(--text-faint); font-weight:600;
  position:relative;
}
.nav-btn .ni{width:20px; height:20px; display:flex; align-items:center; justify-content:center; transition:.2s;}
.nav-btn .ni svg{width:100%; height:100%;}
.nav-btn.active{color:var(--gold);}
.nav-btn.active .ni{transform:translateY(-1px);}
.nav-btn.active::before{
  content:""; position:absolute; top:2px; width:26px; height:26px; border-radius:9px;
  background:var(--gold-glow); z-index:-1;
}

/* ---------- player overlay ---------- */
.player-overlay{
  position:fixed; inset:0; z-index:200; background:#000;
  display:flex; flex-direction:column;
}
.player-head{
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid #1a1a1a;
}
.player-head .p-title{flex:1; font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.player-frame-wrap{
  position:relative; width:100%; aspect-ratio:16/9; background:#000; flex-shrink:0;
}
.player-frame-wrap iframe, .player-frame-wrap video{
  width:100%; height:100%; border:0; display:block; background:#000;
}
.server-tabs{display:flex; gap:8px; padding:14px 16px; overflow-x:auto;}
.server-tab{
  padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700;
  background:var(--bg-elev); border:1px solid var(--card-border); color:var(--text-dim); white-space:nowrap; flex-shrink:0;
}
.server-tab.active{background:var(--teal); color:#04211f; border-color:var(--teal);}
.player-body{flex:1; overflow-y:auto; padding:6px 16px 30px;}
.player-desc{font-size:13px; color:var(--text-dim); line-height:1.8;}
.mark-done-btn{
  margin:16px 0; width:100%; padding:13px; border-radius:12px; font-weight:700; font-size:14px;
  background:var(--teal-glow); border:1px solid var(--teal-dim); color:var(--teal);
}
.mark-done-btn.done{background:var(--teal); color:#04211f;}

/* ---------- admin ---------- */
.admin-fab{
  position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); left:14px; z-index:45;
  width:42px; height:42px; border-radius:50%; background:#141414; border:1px solid var(--card-border);
  color:var(--text-faint); font-size:15px; display:flex; align-items:center; justify-content:center;
  opacity:.55;
}
.modal-overlay{
  position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.7);
  display:flex; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(3px);
}
.modal-sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  background:#0c0c0c; border:1px solid var(--card-border); border-bottom:none;
  border-radius:22px 22px 0 0; padding:22px 18px calc(30px + var(--safe-b));
  animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{width:40px; height:4px; border-radius:4px; background:#2a2a2a; margin:0 auto 18px;}
.sheet-title{font-size:17px; font-weight:800; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:10px; background:var(--bg-elev);
  border:1px solid var(--card-border); color:var(--text); font-family:inherit; font-size:14px;
}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.btn-primary{
  width:100%; padding:14px; border-radius:12px; background:var(--teal); color:#04211f;
  font-weight:800; font-size:14.5px; margin-top:6px;
}
.btn-primary:active{opacity:.85;}
.btn-secondary{
  width:100%; padding:13px; border-radius:12px; background:transparent; color:var(--text-dim);
  border:1px solid var(--card-border); font-weight:700; font-size:13.5px; margin-top:10px;
}
.btn-danger-sm{color:var(--danger); font-size:12px; font-weight:700;}

.admin-tabs{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;}

   يجب أن يمر عبر Cloud Function من طرف الخادم فقط. خطة Spark المجانية لا
   تدعم Cloud Functions القابلة للاستدعاء بدون خطة Blaze (pay-as-you-go)،
   لذلك لو احتجت هذا لاحقًا سيتطلب ترقية الخطة.
   ========================================================================= */

const firebaseConfig = {

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------------------------------------------------------------- */
/* PROGRESS (local, no student accounts — stored per device)              */
/* ---------------------------------------------------------------------- */
const PKEY = 'gnosis_completed_v1';
function getCompleted(){ try{ return JSON.parse(localStorage.getItem(PKEY)||'[]'); }catch(e){ return []; } }
function isDone(lectureId){ return getCompleted().includes(lectureId); }
function setDone(lectureId, val){
  let c = getCompleted();
  if(val && !c.includes(lectureId)) c.push(lectureId);
  if(!val) c = c.filter(id=>id!==lectureId);
  localStorage.setItem(PKEY, JSON.stringify(c));
}

/* FIRESTORE LIVE LISTENERS                                                */
/* ---------------------------------------------------------------------- */
function startListeners(){
  unsub.push(db.collection('subjects').orderBy('order').onSnapshot(snap=>{
    SUBJECTS = snap.docs.map(d=>({id:d.id, ...d.data()}));

  }, err=>console.warn(err)));

    TEACHERS = snap.docs.map(d=>({id:d.id, ...d.data()}));
    updateHeroStats();
    if(!$('view-teachers').classList.contains('hidden')) renderTeachers();

/* ---------------------------------------------------------------------- */
/* VIDEO SOURCE DETECTION (يدعم يوتيوب / Google Drive / رابط فيديو مباشر) */
/* ---------------------------------------------------------------------- */
function resolveServerEmbed(url){
  url = (url||'').trim();
  // Google Drive
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  if(m && url.includes('drive.google.com')){
    return {type:'iframe', src:`https://drive.google.com/file/d/${m[1]}/preview`};
  }
  // YouTube
  m = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  if(m){
    return {type:'iframe', src:`https://www.youtube.com/embed/${m[1]}?rel=0`};
  }
  // Direct video file
  if(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(url)){
    return {type:'video', src:url};
  }
  // Fallback: try iframe anyway
  return {type:'iframe', src:url};
}

  if(c.includes('wrong-password') || c.includes('invalid-credential')) return 'بيانات الدخول غير صحيحة';

  if(c.includes('invalid-email')) return 'بريد إلكتروني غير صالح';

}

/* يضمن وجود سجل الطالب بـ Firestore حتى لو انرفضت الكتابة أول مرة (مثلًا قبل تحديث Rules) —
   كل دخول ناجح "يُصلح" السجل تلقائيًا بدل ما يفشل بصمت. */
function upsertStudentOnLogin(user){
  if(user.uid === ADMIN_UID) return Promise.resolve();
  return db.collection('students').doc(user.uid).set({
    name: user.displayName || '',
    email: user.email || '',
    lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
    loginCount: firebase.firestore.FieldValue.increment(1)
  }, {merge:true}).catch(err=>console.warn('student upsert failed', err));
}

/* PWA — قابل للتثبيت (Manifest عبر Blob + زر تثبيت عائم)                 */
/* ملاحظة صريحة: تسجيل Service Worker يتطلب ملفًا حقيقيًا بنفس الأصل         */
/* (لا يعمل من blob: URL في أغلب المتصفحات)، لذا للحصول على عمل أوفلاين      */
/* كامل أضف ملف sw.js صغير بجانب هذا الملف عند الرفع للاستضافة.            */
/* ---------------------------------------------------------------------- */
const manifest = {
  name: "ZEUS — ΖΕΥΣ", short_name: "ZEUS",
  start_url: ".", display: "standalone",
  background_color: "#070707", theme_color: "#070707",
  icons: [{
    src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23070706'/%3E%3Cpath d='M55 15 20 58h26l-9 33 45-58H55l9-18z' fill='%23F1B76D'/%3E%3C/svg%3E",
    sizes:"192x192", type:"image/svg+xml"
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest'; manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);

/* QUICK SEARCH                                                             */
/* ---------------------------------------------------------------------- */
$('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  $('searchBar').classList.toggle('has-text', !!q);
  if(!q){ $('searchResults').classList.add('hidden'); $('homeContent').classList.remove('hidden'); return; }
  runSearch(q);
});
function clearSearch(){
  $('searchInput').value = '';
  $('searchBar').classList.remove('has-text');
  $('searchResults').classList.add('hidden');
  $('homeContent').classList.remove('hidden');
}
function runSearch(q){
  const nq = q.toLowerCase();
  const subj = SUBJECTS.filter(s=>(s.name||'').toLowerCase().includes(nq));
  const teach = TEACHERS.filter(t=>(t.name||'').toLowerCase().includes(nq));
  const chap = CHAPTERS.filter(c=>(c.title||'').toLowerCase().includes(nq));
  const lec = LECTURES.filter(l=>(l.title||'').toLowerCase().includes(nq));

  const groups = [
    {label:'المواد', icon:'grid', items: subj.map(s=>({title:s.name, path:'مادة دراسية', go:`openSubject('${s.id}')`}))},
    {label:'المدرّسين', icon:'users', items: teach.map(t=>({title:t.name, path:subjName(t.subjectId), go:`jumpToTeacher('${t.id}')`}))},
    {label:'الفصول', icon:'layers', items: chap.map(c=>({title:c.title, path:teachName(c.teacherId), go:`jumpToChapter('${c.id}')`}))},
    {label:'المحاضرات', icon:'playCircle', items: lec.map(l=>({title:l.title, path:chapTitle(l.chapterId), go:`jumpToLecture('${l.id}')`}))},
  ].filter(g=>g.items.length);

  const wrap = $('searchResults');
  $('homeContent').classList.add('hidden');
  wrap.classList.remove('hidden');
  if(!groups.length){
    wrap.innerHTML = emptyHTML('search','ما لقينا نتائج','جرّب كلمة بحث ثانية.');
    return;
  }
  wrap.innerHTML = groups.map(g=>`
    <div class="sr-group-label">${ic(g.icon,13)} ${g.label}</div>
    ${g.items.map(it=>`
      <button class="sr-row" onclick="${it.go}">
        <div class="sr-icon">${ic(g.icon,16)}</div>
        <div class="sr-text">
          <div class="sr-title">${esc(it.title)}</div>
          <div class="sr-path">${esc(it.path||'')}</div>
        </div>
        ${ic('chevronLeft',14)}
      </button>
    `).join('')}
  `).join('');
}
/* jump helpers — resolve the parent chain then navigate straight to the target */
function jumpToTeacher(teacherId){
  const t = TEACHERS.find(x=>x.id===teacherId); if(!t) return;
  cur.subjectId = t.subjectId; cur.teacherId=null; cur.chapterId=null;
  clearSearch(); openTeacher(teacherId);
}
function jumpToChapter(chapterId){
  const c = CHAPTERS.find(x=>x.id===chapterId); if(!c) return;
  cur.subjectId = c.subjectId; cur.teacherId = c.teacherId; cur.chapterId=null;
  clearSearch(); openChapter(chapterId);
}
function jumpToLecture(lectureId){
  const l = LECTURES.find(x=>x.id===lectureId); if(!l) return;
  const c = CHAPTERS.find(x=>x.id===l.chapterId); if(!c) return;
  cur.subjectId = c.subjectId; cur.teacherId = c.teacherId; cur.chapterId = c.id;
  clearSearch();
  renderLecturesTitle(); renderLectures(); showView('lectures');
  playLecture(lectureId);
}

/* ---------------------------------------------------------------------- */
const LWKEY = 'zeus_last_watched';
function saveLastWatched(lecture){
  const c = CHAPTERS.find(x=>x.id===lecture.chapterId);
  if(!c) return;
  localStorage.setItem(LWKEY, JSON.stringify({
    lectureId: lecture.id, chapterId: c.id, teacherId: c.teacherId, subjectId: c.subjectId,
    title: lecture.title, ts: Date.now()
  }));
}
function renderContinueWatch(){
  const slot = $('continueWatchSlot');
  if(!slot) return;
  let data;
  try{ data = JSON.parse(localStorage.getItem(LWKEY)||'null'); }catch(e){ data = null; }
  if(!data || !LECTURES.find(l=>l.id===data.lectureId)){ slot.innerHTML=''; return; }
  slot.innerHTML = `
    <button class="continue-card" onclick="resumeLastWatched()">
      <div class="cc-thumb">${ic('history',22)}</div>
      <div class="cc-text">
        <div class="cc-label">تابع المشاهدة</div>
        <div class="cc-title">${esc(data.title)}</div>
      </div>
      <div class="cc-arrow">${ic('chevronLeft',18)}</div>
    </button>`;
}
function resumeLastWatched(){
  let data;
  try{ data = JSON.parse(localStorage.getItem(LWKEY)||'null'); }catch(e){ data = null; }
  if(!data) return;
  cur.subjectId = data.subjectId; cur.teacherId = data.teacherId; cur.chapterId = data.chapterId;
  renderLecturesTitle(); renderLectures(); showView('lectures');
  playLecture(data.lectureId);
}
